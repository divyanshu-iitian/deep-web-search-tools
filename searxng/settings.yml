use_default_settings: true
search:
  safe_search: 2
  formats:
    - html
    - json
server:
  secret_key: "local-private-search-instance-change-before-public-exposure"
  limiter: false
  public_instance: false
  image_proxy: false
# More independent engines spread the load: Brave, Google and DuckDuckGo throttle a single IP after a few hundred
# organization searches, which made whole batches look like "nothing found".
engines:
  - name: bing
    disabled: false
  - name: mojeek
    disabled: false
  - name: startpage
    disabled: false
  - name: qwant
    disabled: false
  - name: yahoo
    disabled: false
