services:
  search:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - search_data:/app/data
    environment:
      DATA_DIR: /app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  search_data:
