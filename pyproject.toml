[project]
name = "deep-web-search-tools"
version = "0.1.0"
description = "Evidence-first public professional identity search"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["deepsearch*"]

[tool.setuptools.package-data]
deepsearch = ["static/*", "official_accounts.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
